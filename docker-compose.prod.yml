services:
  scheduler:
    image: ghcr.io/melnicorn/cronulent-scheduler:latest
    ports:
      - "3001:3001"
    volumes:
      - scheduler-data:/app/apps/scheduler/data
    environment:
      - PORT=3001
    restart: unless-stopped

  web:
    image: ghcr.io/melnicorn/cronulent-web:latest
    ports:
      - "3000:3000"
    environment:
      - SCHEDULER_URL=http://scheduler:3001
    depends_on:
      - scheduler
    restart: unless-stopped

volumes:
  scheduler-data:
